{"name": "Build APK", "on": {"push": null, "workflow_dispatch": null}, "permissions": {"contents": "write"}, "jobs": {"build": {"runs-on": "ubuntu-latest", "steps": [{"name": "Unpack sources", "run": "echo '' | base64 -d > src.tgz && tar xzf src.tgz && ls app"}, {"uses": "actions/setup-java@v4", "with": {"distribution": "temurin", "java-version": "17"}}, {"uses": "android-actions/setup-android@v3"}, {"uses": "gradle/actions/setup-gradle@v4", "with": {"gradle-version": "8.14.3"}}, {"name": "Build APK", "run": "gradle assembleDebug --no-daemon && cp app/build/outputs/apk/debug/app-debug.apk SnapReader.apk"}, {"uses": "softprops/action-gh-release@v2", "with": {"tag_name": "build-${{ github.run_number }}", "name": "Snap Reader ${{ github.run_number }}", "files": "SnapReader.apk", "make_latest": true}}]}}}
